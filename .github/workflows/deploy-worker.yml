name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy Infrastructure", "Run Tests"]
    types: [completed]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: ./worker
        run: npm ci

      - name: Check bundle size
        working-directory: ./worker
        run: npm run build
      
      - name: Download Terraform Outputs
        uses: actions/download-artifact@v4
        with:
          name: terraform-outputs
          path: /tmp
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Terraform Outputs
        run: |
          echo "D1_DATABASE_ID=$(jq -r .d1_database_id /tmp/tf-outputs.json)" >> $GITHUB_ENV
          echo "KV_NAMESPACE_ID=$(jq -r .kv_namespace_id /tmp/tf-outputs.json)" >> $GITHUB_ENV

      - name: Deploy to Cloudflare
        working-directory: ./worker
        run: npx wrangler deploy --env production
        env:
          D1_DATABASE_ID: ${{ env.D1_DATABASE_ID }}
          KV_NAMESPACE_ID: ${{ env.KV_NAMESPACE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          ENVIRONMENT: production
          USE_MOCKS: 'false'
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          PRINTFUL_API_KEY: ${{ secrets.PRINTFUL_API_KEY }}
          MAILCHANNELS_API_KEY: ${{ secrets.MAILCHANNELS_API_KEY }}
