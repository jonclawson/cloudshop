name: Deploy Worker

on:
  # push:
  #   branches: [main]
  #   paths:
  #     - 'worker/**'
  #     - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ["Setup"]
    types: [completed]

jobs:
  deploy:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: ./worker
        run: npm ci

      - name: Check bundle size
        working-directory: ./worker
        run: npm run build
      
      - name: Download Terraform Outputs
        uses: actions/download-artifact@v4
        with:
          name: terraform-outputs
          path: /tmp
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Terraform Outputs
        run: |
          echo "WORKER_SCRIPT_ID=$(jq -r .worker_script_id.value /tmp/tf-outputs.json)" >> $GITHUB_ENV
          echo "WORKER_NAME=$(jq -r .worker_name.value /tmp/tf-outputs.json)" >> $GITHUB_ENV
          echo "D1_DATABASE_ID=$(jq -r .d1_database_id.value /tmp/tf-outputs.json)" >> $GITHUB_ENV
          echo "KV_NAMESPACE_ID=$(jq -r .kv_namespace_id.value /tmp/tf-outputs.json)" >> $GITHUB_ENV

      - name: Update Wrangler Config with Environment Variables
        working-directory: ./
        run: |
          node -e "
          const fs = require('fs');
          let content = fs.readFileSync('./worker/wrangler.jsonc', 'utf8');
          content = content.replace(/\/\/.*$/gm, '');
          const config = JSON.parse(content);
          config.env.production.d1_databases[0].database_id = process.env.D1_DATABASE_ID;
          config.env.production.kv_namespaces[0].id = process.env.KV_NAMESPACE_ID;
          fs.writeFileSync('./worker/wrangler.jsonc', JSON.stringify(config, null, 2));
          "
        env:
          D1_DATABASE_ID: ${{ env.D1_DATABASE_ID }}
          KV_NAMESPACE_ID: ${{ env.KV_NAMESPACE_ID }}
      
      - name: Run Database Migrations
        working-directory: ./worker
        run: npx wrangler d1 migrations apply DB --env production --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Deploy to Cloudflare
        working-directory: ./worker
        run: npx wrangler deploy --env production
        env:
          WORKER_SCRIPT_ID: ${{ env.WORKER_SCRIPT_ID }}
          WORKER_NAME: ${{ env.WORKER_NAME }}
          D1_DATABASE_ID: ${{ env.D1_DATABASE_ID }}
          KV_NAMESPACE_ID: ${{ env.KV_NAMESPACE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
