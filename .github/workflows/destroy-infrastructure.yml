name: Destroy Infrastructure

on:
  workflow_dispatch:
    inputs:
      destroy:
        description: 'Type "destroy" to confirm infrastructure destruction'
        required: true
        type: string

jobs:
  destroy:
    if: github.event.inputs.destroy != ''
    runs-on: ubuntu-latest
    
    steps:
      - name: Validate confirmation
        run: |
          if [ "${{ github.event.inputs.destroy }}" != "destroy" ]; then
            echo "❌ Confirmation did not match. Type exactly 'destroy' to confirm."
            exit 1
          fi
          echo "✅ Destruction confirmed"

      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Destroy
        if: github.event.inputs.destroy == 'destroy'
        working-directory: ./terraform
        run: terraform destroy -auto-approve
        env:
          TF_VAR_tf_cloud_organization: ${{ secrets.TF_CLOUD_ORGANIZATION }}
          TF_VAR_tf_cloud_workspace: ${{ secrets.TF_CLOUD_WORKSPACE }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CF_API_TOKEN }}
          TF_VAR_account_id: ${{ secrets.CF_ACCOUNT_ID }}
