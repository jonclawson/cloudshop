name: Run Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'tests/**'
      - 'pages/**'
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
      - '.github/workflows/deploy-pages.yml'
      - '.github/workflows/run-tests.yml'
  workflow_dispatch:

jobs:
  test:
    # needs: deploy-infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install worker dependencies
        working-directory: ./worker
        run: npm install

      - name: Install pages dependencies
        working-directory: ./pages
        run: npm install

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Create environment files
        run: |
          # Create Worker environment file
          cat > ./worker/.dev.vars.development << EOF
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          ENVIRONMENT=development
          USE_MOCKS=true
          STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
          PRINTFUL_API_KEY=${{ secrets.PRINTFUL_API_KEY }}
          MAILCHANNELS_API_KEY=${{ secrets.MAILCHANNELS_API_KEY }}
          CLOUDFLARE_API_TOKEN=
          EOF

          # Create Pages environment file
          cat > ./.env.development << EOF
          VITE_API_BASE_URL=http://localhost:8787
          VITE_STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          EOF

      - name: Start Docker containers
        run: docker compose -f docker-compose.test.yml up -d

      - name: Wait for services to be ready
        run: |
          echo "Waiting for services to be ready (max 3 minutes)..."
          for i in {1..30}; do
            worker_ready=$(curl -s http://localhost:8787/health > /dev/null 2>&1 && echo "✓" || echo "✗")
            pages_ready=$(curl -s http://localhost:5173 > /dev/null 2>&1 && echo "✓" || echo "✗")
            echo "[$i/30] Worker: $worker_ready | Pages: $pages_ready"
            docker logs cloudshop-wrangler-1 2>&1 | tail -1
            docker logs cloudshop-pages-1 2>&1 | tail -1

            if [ "$worker_ready" = "✓" ] && [ "$pages_ready" = "✓" ]; then
              echo "✅ Services are ready!"
              exit 0
            fi
            sleep 2
          done
          echo "❌ Services did not start in time after 3 minutes"
          echo "Debug info:"
          docker ps
          docker logs cloudshop-wrangler-1 2>&1 | tail -20
          docker logs cloudshop-pages-1 2>&1 | tail -20
          exit 1

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
