name: Run Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'tests/**'
      - 'pages/**'
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
      - '.github/workflows/deploy-pages.yml'
      - '.github/workflows/run-tests.yml'
  workflow_dispatch:

jobs:
  test:
    # needs: deploy-infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install worker dependencies
        working-directory: ./worker
        run: npm install

      - name: Install pages dependencies
        working-directory: ./pages
        run: npm install

      - name: Install Playwright
        run: |
          npm i
          npx playwright install --with-deps

      - name: Create environment files
        run: |
          # Create Worker environment file
          cat > ./worker/.dev.vars.development << EOF
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          ENVIRONMENT=development
          USE_MOCKS=true
          STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
          PRINTFUL_API_KEY=${{ secrets.PRINTFUL_API_KEY }}
          MAILCHANNELS_API_KEY=${{ secrets.MAILCHANNELS_API_KEY }}
          CLOUDFLARE_API_TOKEN=
          EOF

          # Create Pages environment file
          cat > ./.env.development << EOF
          VITE_API_BASE_URL=http://localhost:8787
          VITE_STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          EOF

      - name: Start Docker containers
        run: docker compose -f docker-compose.test.yml up -d

      - name: Wait for services to be ready
        run: |
          echo "Waiting for services to be ready (max 1 minute)..."
          sleep 5
          echo "Starting health checks..."
          for i in {1..30}; do
            worker_response=$(curl -s --max-time 2 -w "\n%{http_code}" http://127.0.0.1:8787/health 2>&1 || echo "error")
            worker_status=$(echo "$worker_response" | tail -1)
            worker_body=$(echo "$worker_response" | head -n -1)
            worker_ready=$([ "$worker_status" = "200" ] && echo "✓" || echo "✗")
            
            pages_response=$(curl -s --max-time 2 -w "\n%{http_code}" http://127.0.0.1:5173 2>&1 || echo "error")
            pages_status=$(echo "$pages_response" | tail -1)
            pages_ready=$([ "$pages_status" = "200" ] && echo "✓" || echo "✗")
            
            echo "[$i/30] Worker: $worker_ready (HTTP $worker_status) | Pages: $pages_ready (HTTP $pages_status)"
            [ "$i" -eq 1 ] || [ "$i" -eq 15 ] || [ "$i" -eq 30 ] && echo "  Worker response: $worker_body"

            if [ "$worker_ready" = "✓" ] && [ "$pages_ready" = "✓" ]; then
              echo "✅ Services are ready!"
              exit 0
            fi
            sleep 2
          done
          echo "❌ Services did not start in time after 1 minute"
          echo "Debug info:"
          docker ps
          echo ""
          echo "Container status:"
          docker inspect cloudshop-wrangler-1 --format='{{.State.Status}}'
          docker inspect cloudshop-pages-1 --format='{{.State.Status}}'
          echo ""
          echo "Testing health endpoint directly:"
          curl -v http://127.0.0.1:8787/health 2>&1 | head -30
          echo ""
          echo "Wrangler logs (last 30 lines):"
          docker logs cloudshop-wrangler-1 2>&1 | tail -30
          echo ""
          echo "Checking if wrangler process is still running:"
          docker exec cloudshop-wrangler-1 ps aux | grep wrangler || echo "No wrangler process found"
          exit 1

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
