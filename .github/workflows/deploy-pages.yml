name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'pages/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy Infrastructure", "Run Tests"]
    types: [completed]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: ./pages
        run: npm ci

      - name: Build
        working-directory: ./pages
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.API_BASE_URL }}
          VITE_USE_MOCKS: 'false'
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}

      - name: Download Terraform Outputs
        uses: actions/download-artifact@v4
        with:
          name: terraform-outputs
          path: /tmp
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Terraform Outputs
        run: |
          echo "PAGES_PROJECT_ID=$(jq -r .pages_project_id.value /tmp/tf-outputs.json)" >> $GITHUB_ENV
          echo "PAGES_PROJECT_NAME=$(jq -r .pages_project_name.value /tmp/tf-outputs.json)" >> $GITHUB_ENV

      - name: Deploy to Cloudflare Pages
        working-directory: ./pages
        run: npx wrangler pages deploy dist --project-name=${{ env.PAGES_PROJECT_NAME }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
